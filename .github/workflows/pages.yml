name: results-pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'scripts/build-pages.sh'
      - 'web/**'
      - 'suites/**'
      - 'src/gammabench/assets/**'
      - 'src/gammabench/*.py'
      - 'docs/results/**'
      - 'snapshots/**'
      - 'artifacts.json'
  workflow_dispatch:
  repository_dispatch:
    types: [ci-results]
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Read the latest preview results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .gammabench/pr-results
          if git ls-remote --exit-code --heads origin pr-results > "$RUNNER_TEMP/preview-ref"; then
            git fetch --depth=1 origin refs/heads/pr-results
            git archive FETCH_HEAD | tar -x -C .gammabench/pr-results
          else
            status=$?
            test "$status" -eq 2
          fi
      - uses: typst-community/setup-typst@48aeee7543d37f01afd1ffb27307dc277387ba13 # v4
        with:
          typst-version: '0.15.1'
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Compile Typst pages and assemble reports and evidence
        run: |
          bash scripts/build-pages.sh .gammabench/pages-site
          PYTHONPATH=src python3 -m gammabench.ci assemble-previews \
            .gammabench/pr-results .gammabench/pages-site --framework "$PWD"
      - name: Upload site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .gammabench/pages-site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
