name: framework
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '${{ matrix.python }}'
      - uses: typst-community/setup-typst@48aeee7543d37f01afd1ffb27307dc277387ba13 # v4
        with:
          typst-version: '0.15.1'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: gammabench validate suites/examples/sum.json
      - run: gammabench run suites/examples/sum.json results/demo --repeats 3 --warmups 1
      - run: gammabench verify results/demo
      - run: gammabench report results/demo --output results/report --baseline loop
      - name: Verify historical snapshots
        run: |
          for snapshot in snapshots/historical/*; do
            gammabench verify "$snapshot"
          done
