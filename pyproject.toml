[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gammabench"
version = "0.1.0"
description = "Reproducible benchmark suites, immutable result snapshots and comparable analysis"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "lcnbr", email = "im@lcnbr.ch"}]
dependencies = []

[project.scripts]
gammabench = "gammabench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gammabench = ["assets/*.html", "assets/*.css", "assets/*.js"]
